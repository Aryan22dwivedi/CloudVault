version: '3.8'
services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: cloudvault_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cloudvault
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. MinIO (Local Cloud Storage)
  minio:
    image: minio/minio
    container_name: cloudvault_cloud
    ports:
      - "9000:9000"   # API Port
      - "9001:9001"   # Console Port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: